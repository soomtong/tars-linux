# RM-M0: 부트로더가 실패하면 그 말이 시리얼로 나와야 한다. limine의 메뉴와
# 에러는 원래 GOP/VGA 콘솔로만 가는데 체인들은 전부 `-display none`이라
# 아무것도 안 보인다. UEFI 스파이크가 정확히 그 벽에 부딪혔다 — 시리얼이
# 320바이트에서 멈추고, 이 줄을 넣자
# `PANIC: linux: Non-relocatable kernel could not be loaded at required
# address 0x100000`이 나왔다. 병은 커널이 아니라 CONFIG_RELOCATABLE이었다.
#
# 대가는 로그에 커서 이동 escape가 글자마다 섞이는 것이다. 체인들의 판정은
# 전부 부분 문자열 매치이고 우리 쪽 줄(tars-init:, terminal:)에는 escape가
# 안 붙으므로 판정에 닿지 않는다.
serial: yes
timeout: 0

/TARS
    protocol: linux
    kernel_path: boot():/boot/bzImage
    module_path: boot():/boot/initrd.cpio
    cmdline: console=ttyS0
