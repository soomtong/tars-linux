# clojure CLI의 첫 실행이 ~/.m2/repository로 받는 것(TP-M5 plan 확인 4 · 결정 B). 한 줄에 `<maven2 아래 경로> <sha256>`.
#
# 출처는 https://repo1.maven.org/maven2/. 판은 clojure-tools tarball의 root deps(`org.clojure/clojure {:mvn/version …}`)와
# 그 pom이 부르는 의존이다 — clojure를 올리면 이 파일도 다시 만든다(plan 위험 3).
#
# 만든 방법(2026-11-06): 망이 있는 amd64 trixie 컨테이너에서 `clojure -M -e …`를 한 번 돌리고 ~/.m2/repository에 생긴 jar · pom을
# 적었다. 줄마다 Central의 `<경로>.sha1`과 먼저 대조했고(일곱 다 맞음), 그 뒤 sha256을 적었다. 부속 파일(`_remote.repositories`,
# `.sha1`)은 싣지 않는다 — jar · pom만으로 망 없이 선다(plan 확인한 것).
