# 개발 도구 층의 출처 — 이것이 사는 유일한 자리다(TP design 결정 1). 도구 하나가 [[tool]] 표 하나다(MF design).
#
# make dev-layers가 devlayer/manifest-gen.zig로 이 파일을 검사해 devlayer/build/manifest.tsv(커밋하지 않는다)를 쓰고,
# harvest.sh · build.sh는 그 TSV를 읽는다. make quick도 같은 변환을 한 번 돌리므로 잘못 고친 것은 거기서 먼저 걸린다.
# 읽는 문법은 TOML의 일부다: 주석, [[tool]], 키 = "문자열", 키 = 정수, 키 = ["문자열", …](여러 줄 · 끝 쉼표 가능).
# 작은따옴표 · 이스케이프(\) · 점 키 · 인라인 표는 줄 번호와 함께 거절한다. 값에는 공백이 없다.
#
# 공통 키(반드시): name · bundle · version · kind. 판 번호는 늘 따옴표 안이다 — "1:1.17-4" 같은 Debian 판도 글자 그대로다.
# kind는 여섯이다. 앞의 것이 있으면 앞의 것을 쓴다: upstream → vendor-repo → prebuilt → debian(maven · hex는 잠금 파일).
#   upstream     url · sha256. 도구가 직접 내는 linux-amd64 tarball · zip(url이 압축 확장자가 아니면 실행 파일 하나 — TP-M7).
#                받은 것은 devlayer/cache/<sha256>
#   prebuilt     url · sha256. 표준이 된 제3자 빌드(python-build-standalone · rv-ruby · builds.hex.pm의 erlang)
#   vendor-repo  repo · package. 도구 쪽이 운영하는 Debian 저장소(devlayer/repos.tsv, TP-M10). 서명된 Release가 검증한다
#   debian       키 없음(패키지 이름이 name과 다를 때만 package). 판은 version으로 `=` 고정한다. 의존은 apt가 풀고,
#                실제로 깔린 목록은 묶음 안 usr/share/tars/layers/<묶음>.pkgs에 남는다. 서명된 Release가 검증한다
#   maven · hex  lock · sha256. devlayer/<종류>/의 잠금 파일과 그 파일의 sha256(TP-M5 · TP-M6)
# 선택 키(적힌 순서대로 TSV 일곱째 열이 된다 — 순서를 바꾸면 그 묶음을 다시 굽는다, 내용은 같아도):
#   exe = ["a", "b"]  링크할 실행 파일(도구 디렉터리 기준). 없으면 bin/의 실행 파일 전부
#   hook = "X"        풀기를 devlayer/hooks/X.sh가 한다(받기 · sha256은 build.sh)
#   into = "T"        도구 디렉터리를 T-<버전>으로(rust-src가 rust의 자리로)
#   strip = N         풀고 나서 벗길 맨 위 디렉터리의 단 수(기본 1). 0이면 맨 위의 파일을 그대로
#   man1 = "D"        도구 디렉터리의 D/*.1 · D/*.1.gz를 /usr/local/share/man/man1/에 링크한다
#
# 버전을 바꾸는 것은 TARS 버전을 낼 때 한 단계로 한다(결정 3). libc6-dev는 initrd의 glibc와 같은 판이어야 한다 —
# devlayer/harvest.sh가 다르면 두 판을 찍고 실패한다(TP-M0 plan 결정 B). 표를 바꾸면 그 묶음만 다시 굽는다(결정 6).

