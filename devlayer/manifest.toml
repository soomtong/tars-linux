# mkcert(TP-M10 plan 덧붙임, 사용자 요청 2026-11-08): 개발용 로컬 CA와 인증서를 홈에(~/.local/share/mkcert) — root도 망도 필요 없다. 마지막 릴리스가
# 1.4.4(2022-04)이고 체크섬을 내지 않아 받은 파일의 sha256을 적었다. 압축 없는 실행 파일 하나(TP-M7의 길). `mkcert -install`은 TARS에서 안 된다
# (update-ca-certificates가 없고 CA 묶음은 부팅마다 initrd에서 선다) — CA 파일을 --cacert 등으로 직접 준다. 시스템 신뢰는 TP-M11 후보.
[[tool]]
name = "mkcert"
bundle = "util"
version = "1.4.4"
kind = "upstream"
url = "https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64"
sha256 = "6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52"

# debian: hurl의 NEEDED libxml2(libcurl.so.4는 initrd에 있다). wget. ipcalc · vifm은 perl에 기대 base에 둔다(위, TP-M8).
[[tool]]
name = "wget"
bundle = "util"
version = "1.25.0-2"
kind = "debian"

[[tool]]
name = "libxml2"
bundle = "util"
version = "2.12.7+dfsg+really2.9.14-2.1+deb13u3"
kind = "debian"

# ── server(TP-M10) — 실행 파일까지. 서비스 · 재부팅을 넘는 데이터는 서버(서비스) milestone(plan 비목표 1) ─────────────
# vendor-repo의 저장소와 키는 devlayer/repos.tsv · devlayer/keys/. mysql은 generic tarball이 trixie에서 서지 않아(libaio.so.1 —
# trixie는 time64 전환으로 libaio.so.1t64) Oracle의 trixie 저장소다 — 결정 1의 순서 예외(사용자 결정, plan 확인 3). nginx는 stable 갈래(사용자 결정).
# 의존(postgresql-client-18 · redis-tools와 같은 판, libaio1t64 등)은 apt가 푼다. 서비스 계정은 거두지 않는다(harvest의 계정 파일 제외).
[[tool]]
name = "postgresql"
bundle = "server"
version = "18.6-1.pgdg13+2"
kind = "vendor-repo"
repo = "pgdg"
package = "postgresql-18"

[[tool]]
name = "mysql-server"
bundle = "server"
version = "9.7.4-1debian13"
kind = "vendor-repo"
repo = "mysql"
package = "mysql-community-server-core"

[[tool]]
name = "mysql-client-core"
bundle = "server"
version = "9.7.4-1debian13"
kind = "vendor-repo"
repo = "mysql"
package = "mysql-community-client-core"

# mysql-client: mysqladmin · mysqlcheck · mysqlimport · mysqlshow는 core가 아닌 이 꾸러미다(plan 확인한 것). mysql-common을 끌고 와
# /etc/mysql/my.cnf가 conf.d를 include한다 — TARS의 기본값은 files/server/etc/mysql/conf.d/tars.cnf.
[[tool]]
name = "mysql-client"
bundle = "server"
version = "9.7.4-1debian13"
kind = "vendor-repo"
repo = "mysql"
package = "mysql-community-client"

[[tool]]
name = "nginx"
bundle = "server"
version = "1.30.6-1~trixie"
kind = "vendor-repo"
repo = "nginx"
package = "nginx"

[[tool]]
name = "redis"
bundle = "server"
version = "6:8.10.3-1rl1~trixie1"
kind = "vendor-repo"
repo = "redis"
package = "redis-server"

[[tool]]
name = "redis-tools"
bundle = "server"
version = "6:8.10.3-1rl1~trixie1"
kind = "vendor-repo"
repo = "redis"
package = "redis-tools"

