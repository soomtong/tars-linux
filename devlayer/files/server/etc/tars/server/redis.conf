# TARS 개발 도구 층 server — redis 서비스의 설정 원본(TP-M11 plan 결정 B). 덧붙일 것은 /config/redis.d/*.conf에(sudo).
bind 127.0.0.1 -::1
port 6379
daemonize no
supervised no
# 빈 값은 stdout — init 콘솔로 간다.
logfile ""
dir /var/lib/redis
# 매 쓰기를 1초 안에 디스크로. 서비스를 끌 때(SIGTERM 뒤 3초에 SIGKILL) 스냅숏을 못 마쳐도 데이터가 남는다.
appendonly yes
appendfsync everysec
include /config/redis.d/*.conf
