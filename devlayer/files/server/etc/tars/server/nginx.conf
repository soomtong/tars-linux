# TARS 개발 도구 층 server — nginx 서비스의 설정 원본(TP-M11 plan 결정 B). 덧붙일 것은 /config/nginx.d/*.conf에(sudo) —
# http 블록 안으로 읽힌다(server { ... } 하나씩). 사용자(uid 1000)로 돌아 1024 아래 포트는 못 연다.
worker_processes 1;
pid /var/lib/nginx/nginx.pid;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # 접근 로그 파일은 만들지 않는다(plan 맡아 정한 것 4). 원하면 조각에서: access_log /home/.tars/var/nginx/access.log;
    access_log off;

    client_body_temp_path /var/lib/nginx/client_body;
    proxy_temp_path /var/lib/nginx/proxy;
    fastcgi_temp_path /var/lib/nginx/fastcgi;
    uwsgi_temp_path /var/lib/nginx/uwsgi;
    scgi_temp_path /var/lib/nginx/scgi;

    server {
        listen 127.0.0.1:8080;
        root /usr/share/nginx/html;
        index index.html;
    }

    include /config/nginx.d/*.conf;
}
